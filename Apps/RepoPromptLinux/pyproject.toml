[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repoprompt-ce-gui"
version = "0.1.0"
description = "Native Linux desktop frontend for the RepoPrompt CE context engine"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["PySide6-Essentials==6.10.3"]

[project.scripts]
repoprompt-gui = "repoprompt_gui.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repoprompt_gui = ["resources/*.svg"]
