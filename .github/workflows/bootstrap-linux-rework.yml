name: Bootstrap Linux headless rework

on:
  push:
    branches:
      - linux-headless-mcp-rework
    paths:
      - ".github/bootstrap_linux_rework.py"
      - ".github/workflows/bootstrap-linux-rework.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  rewrite:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out fresh branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Fetch legacy portability reference
        run: git fetch origin linux-headless-mcp:refs/remotes/origin/legacy-linux-headless

      - name: Generate focused implementation
        run: |
          set -euo pipefail
          sed -i 's/"""Smoke-test the Linux headless MCP binary or final container\."""/# Smoke-test the Linux headless MCP binary or final container./' .github/bootstrap_linux_rework.py
          python3 .github/bootstrap_linux_rework.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path("Scripts/test_linux_headless_mcp.py")
          lines = path.read_text(encoding="utf-8").splitlines()
          if lines and lines[0] == "\\":
              lines = lines[1:]
          lines = [line[12:] if line.startswith("            ") else line for line in lines]
          text = "\n".join(lines) + "\n"
          needle = "        environment = os.environ.copy()\n"
          replacement = (
              "        if mode == \"docker\":\n"
              "            for directory in (workspace, profile, workspace / \"Sources\"):\n"
              "                directory.chmod(0o777)\n"
              "        environment = os.environ.copy()\n"
          )
          if needle not in text:
              raise SystemExit("smoke-test environment insertion point not found")
          path.write_text(text.replace(needle, replacement, 1), encoding="utf-8")
          path.chmod(0o755)
          PY

      - name: Set up Swift 6.2.1
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a
        with:
          swift-version: "6.2.1"

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends g++ git libstdc++-14-dev pkg-config python3 python3-yaml

      - name: Validate generated support files
        run: |
          set -euo pipefail
          python3 -m py_compile Scripts/test_linux_headless_mcp.py
          python3 -c 'import pathlib, yaml; yaml.safe_load(pathlib.Path(".github/workflows/linux-headless.yml").read_text())'
          bash -n Scripts/test_linux_headless_native.sh Scripts/test_linux_headless_docker.sh

      - name: Package generated tree
        env:
          BASE_SHA: 0c1aa28f8179ff98c11f6dbb420101eeba944a26
        run: |
          set -euo pipefail
          rm .github/bootstrap_linux_rework.py
          rm .github/workflows/bootstrap-linux-rework.yml
          {
            git diff --name-status "$BASE_SHA"
            git ls-files --others --exclude-standard | sed 's/^/A\t/'
          } | sort -u > /tmp/linux-headless-files.txt
          {
            git diff --name-only --diff-filter=ACMRTUXB -z "$BASE_SHA" --
            git ls-files --others --exclude-standard -z
          } | sort -zu \
            | tar --null --files-from=- --create --gzip --file=/tmp/linux-headless-tree.tar.gz
          test -s /tmp/linux-headless-tree.tar.gz
          cat /tmp/linux-headless-files.txt

      - name: Build and exercise native backend
        env:
          SWIFT_JOBS: "4"
        run: |
          set +e
          bash Scripts/test_linux_headless_native.sh 2>&1 | tee /tmp/linux-headless-native.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Build and exercise final image
        run: |
          set +e
          bash Scripts/test_linux_headless_docker.sh "repoprompt-ce-headless:bootstrap-${GITHUB_SHA}" 2>&1 \
            | tee /tmp/linux-headless-docker.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-headless-diagnostics
          path: |
            /tmp/linux-headless-tree.tar.gz
            /tmp/linux-headless-files.txt
            /tmp/linux-headless-native.log
            /tmp/linux-headless-docker.log
          if-no-files-found: warn
          retention-days: 1

      - name: Upload validated tree
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-headless-validated-tree
          path: |
            /tmp/linux-headless-tree.tar.gz
            /tmp/linux-headless-files.txt
          if-no-files-found: error
          retention-days: 1
