name: Xcode Workspace Validation

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'
  push:
    branches:
      - main
    paths:
      - 'Package.swift'
      - 'Package.resolved'
      - 'Makefile'
      - 'Scripts/generate_xcode_workspace.py'
      - 'Scripts/xcode_developer_workflow.sh'
      - 'Scripts/test_xcode_workspace_generator.py'
      - '.github/workflows/xcode-workspace.yml'
      - 'docs/architecture/xcode-workspace.md'
  pull_request:
    paths:
      - 'Package.swift'
      - 'Package.resolved'
      - 'Makefile'
      - 'Scripts/generate_xcode_workspace.py'
      - 'Scripts/xcode_developer_workflow.sh'
      - 'Scripts/test_xcode_workspace_generator.py'
      - '.github/workflows/xcode-workspace.yml'
      - 'docs/architecture/xcode-workspace.md'

permissions:
  contents: read

concurrency:
  group: xcode-workspace-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate Generated Xcode Workspace
    # Keep native ARM coverage and the original enforcing measurement platform.
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate generated Xcode workspace
        run: make xcode-validate
