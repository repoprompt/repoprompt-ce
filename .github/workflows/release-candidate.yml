name: Release Candidate

on:
  workflow_dispatch:
  push:
    branches:
      - main

# Only first-attempt automatic main pushes supersede each other. Explicit
# dispatches and reruns retain their own groups so a later push or manual request
# cannot replace those requested builds.
concurrency:
  group: >-
    release-candidate-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == '1' && 'main' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == '1' }}

permissions:
  contents: read

jobs:
  artifact:
    name: Package Ad-Hoc Candidate
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Run release preflight
        run: ./Scripts/release.sh preflight

      - name: Package ad-hoc release candidate
        run: ./Scripts/release.sh artifact

      - name: Smoke release-candidate packaged MCP roundtrip
        run: |
          ./Scripts/smoke_packaged_mcp_roundtrip.sh \
            ".build/release/RepoPrompt.app" \
            "Release-candidate packaged app" \
            ".build/release/RepoPrompt-artifact-manifest.json"
      - name: Upload release-candidate artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: RepoPrompt-CE-release-candidate
          path: dist/*
          if-no-files-found: error
