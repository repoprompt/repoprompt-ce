name: Secret-free Integration Products

# Shared implementation for admission; credentialed publication stays independent.
on:
  workflow_call:
    inputs:
      admission:
        type: string
        required: true

permissions:
  contents: read

jobs:
  sentry:
    name: Sentry Build and Privacy
    runs-on: macos-26
    timeout-minutes: 60
    env:
      ADMISSION_CONTEXT: ${{ inputs.admission }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact candidate and full-profile attempt
        run: python3 Scripts/ci_admission.py verify --context "$ADMISSION_CONTEXT" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"

      # Never restore compiled products/gate metadata here: this lane must build
      # the declared checkout with Sentry enabled, not consume a cached success.
      - name: Restore checksum-verified dependency binaries only
        uses: actions/cache/restore@v6
        with:
          path: |
            .build/artifacts
            .build/swiftbuild/artifacts
            Packages/RepoPromptAgentProviders/.build/artifacts
            ~/Library/Caches/org.swift.swiftpm/artifacts
          key: ${{ runner.os }}-${{ runner.arch }}-swiftpm-binaries-v1-${{ hashFiles('Package.resolved', 'Packages/RepoPromptAgentProviders/Package.resolved') }}

      - name: Resolve Sentry dependencies
        env:
          REPOPROMPT_ENABLE_SENTRY: "1"
        run: python3 Scripts/ci_resolve_packages.py

      - name: Build app with Sentry linked
        env:
          REPOPROMPT_ENABLE_SENTRY: "1"
        run: ./conductor swift-build --product RepoPrompt --full-log

      - name: Test serialized Sentry privacy boundary
        env:
          REPOPROMPT_ENABLE_SENTRY: "1"
        run: ./conductor test --filter SentryTelemetryPrivacyTests --full-log

  package:
    name: Release-mode Package and MCP Smoke
    runs-on: macos-26
    # Conductor bounds universal artifact construction at four hours. Let that
    # deadline report failure and leave time for smoke/diagnostic upload instead
    # of cancelling a still-valid build at the former two-hour job limit.
    timeout-minutes: 270
    env:
      ADMISSION_CONTEXT: ${{ inputs.admission }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact candidate and full-profile attempt
        run: python3 Scripts/ci_admission.py verify --context "$ADMISSION_CONTEXT" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"

      - name: Configure retained package diagnostics
        run: echo "REPOPROMPT_DEV_DAEMON_STATE_DIR=$RUNNER_TEMP/admission-conductor" >> "$GITHUB_ENV"

      - name: Identify release build cache compatibility
        id: release-toolchain
        shell: bash
        run: |
          set -euo pipefail
          {
            xcodebuild -version
            xcrun swift --version
            xcrun --sdk macosx --show-sdk-path
            xcrun --sdk macosx --show-sdk-version
            printf '%s\n' "${ImageOS:-}" "${ImageVersion:-}" "$GITHUB_WORKSPACE"
          } > "$RUNNER_TEMP/admission-release-toolchain.txt"
          toolchain="$(shasum -a 256 "$RUNNER_TEMP/admission-release-toolchain.txt" | awk '{print $1}')"
          echo "key=$toolchain" >> "$GITHUB_OUTPUT"

      # Cache only SwiftPM intermediates, never packaged apps or admission evidence.
      # One immutable main seed per compatible toolchain/policy avoids per-PR churn.
      - name: Restore universal release build intermediates
        id: release-cache
        uses: actions/cache/restore@v6
        with:
          path: .build/public-release-swiftpm
          key: ${{ runner.os }}-${{ runner.arch }}-swiftpm-admission-release-v1-${{ steps.release-toolchain.outputs.key }}-${{ hashFiles('Package.swift', 'Package.resolved', 'Packages/**/Package.swift', 'Packages/**/Package.resolved', 'Scripts/build_swiftpm_release_products.sh', 'Scripts/patch_keyboard_shortcuts_resource_lookup.sh', 'Scripts/patches/*.patch', 'Scripts/run_without_github_tokens.sh', 'Scripts/compare_swiftpm_release_resources.py', 'Scripts/conductor.py', 'Scripts/package_app.sh', 'Scripts/release.sh', 'Scripts/release_sentry_symbols.sh', 'Vendor/Sparkle/SHA256SUMS', '.github/workflows/ci-integration-products.yml') }}

      - name: Run release preflight
        run: ./conductor release preflight --full-log

      - name: Package secret-free universal ad-hoc release candidate
        timeout-minutes: 245
        env:
          REPOPROMPT_CLEAN_PUBLIC_SWIFTPM_BUILDS: "0"
        run: ./conductor release artifact --full-log

      - name: Smoke exact release-mode packaged MCP helper
        env:
          REPOPROMPT_PACKAGED_SMOKE_DIAGNOSTICS_DIR: ${{ runner.temp }}/packaged-smoke
        run: |
          ./Scripts/smoke_packaged_mcp_roundtrip.sh \
            ".build/release/RepoPrompt.app" \
            "Admission release-mode package" \
            ".build/release/RepoPrompt-artifact-manifest.json"

      - name: Seed universal release build cache (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.release-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .build/public-release-swiftpm
          key: ${{ steps.release-cache.outputs.cache-primary-key }}

      - name: Transfer the same candidate to older macOS runners
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: compatibility-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/*.zip
            dist/SHA256SUMS
            dist/*-artifact-manifest.json
          if-no-files-found: error
          retention-days: 1

      - name: Retain package manifest and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admission-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .build/release/RepoPrompt-artifact-manifest.json
            ${{ runner.temp }}/packaged-smoke
            ${{ runner.temp }}/admission-conductor/jobs/*.log
          if-no-files-found: warn
          retention-days: 7

  compatibility:
    name: Older macOS Compatibility
    needs: package
    uses: ./.github/workflows/macos-compatibility.yml
    with:
      artifact-name: compatibility-candidate-${{ github.run_id }}-${{ github.run_attempt }}
      tooling-ref: ${{ github.sha }}
      admission: ${{ inputs.admission }}
