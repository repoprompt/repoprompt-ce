name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
    branches: [main]
  push:
    branches:
      - main

concurrency:
  # Supersede obsolete PR previews only. Queue candidates, main evidence, and
  # explicitly rerun full profiles retain their own run-scoped groups.
  group: ci-${{ github.event_name == 'pull_request' && github.run_attempt == '1' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == '1' }}

permissions:
  contents: read

jobs:
  candidate:
    name: Declare Integration Candidate
    runs-on: ubuntu-latest
    outputs:
      context: ${{ steps.candidate.outputs.context }}
      range: ${{ steps.candidate.outputs.range }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Normalize candidate, base, tree and profile
        id: candidate
        run: |
          python3 Scripts/ci_admission.py prepare --event-path "$GITHUB_EVENT_PATH" \
            --event-name "$GITHUB_EVENT_NAME" --sha "$GITHUB_SHA" --ref "$GITHUB_REF" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --output "$GITHUB_OUTPUT"

  integration-products:
    needs: candidate
    uses: ./.github/workflows/ci-integration-products.yml
    with:
      admission: ${{ needs.candidate.outputs.context }}

  build-test-bundles:
    needs: candidate
    env:
      ADMISSION_CONTEXT: ${{ needs.candidate.outputs.context }}
    name: Build and Static Gates
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact candidate and full-profile attempt
        run: python3 Scripts/ci_admission.py verify --context "$ADMISSION_CONTEXT" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"

      - name: Restore SwiftPM build cache
        id: rootbundles-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .build
            Packages/RepoPromptAgentProviders/.build
          # Own prefix: must never prefix-match the Sentry or sources caches.
          key: ${{ runner.os }}-${{ runner.arch }}-swiftpm-rootbundles-${{ hashFiles('Package.swift', 'Package.resolved', 'Packages/RepoPromptAgentProviders/Package.swift', 'Packages/RepoPromptAgentProviders/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swiftpm-rootbundles-${{ hashFiles('Package.swift', 'Package.resolved', 'Packages/RepoPromptAgentProviders/Package.swift', 'Packages/RepoPromptAgentProviders/Package.resolved') }}-
            ${{ runner.os }}-${{ runner.arch }}-swiftpm-rootbundles-

      - name: Invalidate cached admission evidence before any build or selftest
        if: always()
        run: python3 Scripts/ci_admission.py invalidate --context "$ADMISSION_CONTEXT" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"

      - name: Restore checksum-verified SwiftPM binary artifacts
        id: binaries-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .build/artifacts
            .build/swiftbuild/artifacts
            Packages/RepoPromptAgentProviders/.build/artifacts
            ~/Library/Caches/org.swift.swiftpm/artifacts
          key: ${{ runner.os }}-${{ runner.arch }}-swiftpm-binaries-v1-${{ hashFiles('Package.resolved', 'Packages/RepoPromptAgentProviders/Package.resolved') }}

      - name: Resolve dependency downloads with bounded retries
        run: |
          python3 Scripts/ci_resolve_packages.py
          python3 Scripts/ci_resolve_packages.py --scratch-path .build/swiftbuild
          python3 Scripts/ci_resolve_packages.py --root Packages/RepoPromptAgentProviders

      - name: Run repository guardrails
        run: make guardrails

      - name: Run hosted runner and admission selftests
        run: make ci-app-test-runner-selftest

      - name: Install Swift style tools
        run: ./Scripts/install_format_tools.sh install

      - name: Run Swift style lint
        run: make lint

      - name: Run conductor tests
        run: make conductor-selftest

      - name: Set up Node for pinned Codex CLI
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pinned Codex CLI
        run: npm install --global @openai/codex@0.164.0

      - name: Validate Codex app-server schema contract
        run: make dev-codex-schema-check

      - name: Run release workflow tests
        run: make release-selftest

      - name: Run provider package tests
        run: ./conductor provider-test

      - name: Build root test bundles with import and type-check gates
        shell: bash
        env:
          # One measurement protocol and unchanged budget on PR, queue and main.
          TYPECHECK_RATCHET_ENFORCE: "1"
        run: |
          set -uo pipefail
          set +e
          ./conductor ci-build-tests 2>&1 | tee "$RUNNER_TEMP/ci-build-tests-conductor.txt"
          build_status=${PIPESTATUS[0]}
          set -e
          if (( build_status != 0 )); then
            log_path="$(sed -n 's/^Log:[[:space:]]*//p' "$RUNNER_TEMP/ci-build-tests-conductor.txt" | tail -n 1)"
            if [[ -n "$log_path" && -f "$log_path" ]]; then
              cp "$log_path" "$RUNNER_TEMP/ci-build-tests.log"
              echo 'Compiler errors and test failures from the full conductor log:'
              grep -E 'error:|FAIL' "$RUNNER_TEMP/ci-build-tests.log" || true
            else
              echo "Conductor full log was unavailable: $log_path" >&2
            fi
          fi
          exit "$build_status"

      - name: Retain type-check measurements on success and failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-timing-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/modularization/typecheck-timing.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failed root test build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: root-build-tests-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ci-build-tests.log
            ${{ runner.temp }}/ci-build-tests-conductor.txt
          if-no-files-found: warn

      - name: Gate compiler index ratchets on the built sources
        id: compiler_index_gate
        run: python3 Scripts/modularization_index_graph.py check --output .build/modularization/index-check.json

      - name: Capture failed compiler index graph
        if: ${{ failure() && steps.compiler_index_gate.outcome == 'failure' }}
        run: |
          mkdir -p .build/modularization
          python3 Scripts/modularization_index_graph.py dump --output .build/modularization/index-failure-graph.json

      - name: Retain failed compiler index diagnostics
        if: ${{ failure() && steps.compiler_index_gate.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: compiler-index-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .build/modularization/index-failure-graph.json
            .build/modularization/app-source-sha256.json
          if-no-files-found: error
          retention-days: 3

      # All executor-parity module checks gate PRs before merge, on the same warm VM.
      - name: Run all app-free module parity tests
        shell: bash
        run: |
          set -euo pipefail
          modules="$(python3 Scripts/modularization_affected_tests.py --all | python3 -c 'import json,sys; print(" ".join(row["module"] for row in json.load(sys.stdin)["include"]))')"
          test -n "$modules"
          for module in $modules; do
            ./conductor test --module "$module" --full-log
          done

      - name: Retain full module execution logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: module-execution-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/ci-test-results/module-*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Bind root producer to the immutable candidate
        run: python3 Scripts/ci_admission.py bind --context "$ADMISSION_CONTEXT" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"

      - name: Archive only runnable test products and gate attestations
        run: python3 Scripts/modularization_ci_artifact.py pack --output root-build.tar.gz --admission-context "$ADMISSION_CONTEXT"

      - name: Share expected coverage independently of the runnable products
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: expected-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .build/modularization/ci-test-list.txt
            .build/modularization/test-targets.json
            .build/modularization/admission.json
          if-no-files-found: error
          retention-days: 7

      - name: Share the single build with test shards
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: root-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: root-build.tar.gz
          retention-days: 7

      # Keep binary artifacts main-scoped too; PRs restore without saving their own caches.
      - name: Save checksum-verified SwiftPM binary artifacts (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.binaries-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            .build/artifacts
            .build/swiftbuild/artifacts
            Packages/RepoPromptAgentProviders/.build/artifacts
            ~/Library/Caches/org.swift.swiftpm/artifacts
          key: ${{ steps.binaries-cache.outputs.cache-primary-key }}

      # Save the compiled cache only from main, so PR runs restore a warm, main-built cache
      # (PR-scoped caches would evict it). One key per main commit keeps it current.
      - name: Save SwiftPM build cache (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.rootbundles-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            .build
            Packages/RepoPromptAgentProviders/.build
          key: ${{ steps.rootbundles-cache.outputs.cache-primary-key }}

  build-and-test:
    name: Test Root Shard (No Build)
    needs: [candidate, build-test-bundles]
    env:
      ADMISSION_CONTEXT: ${{ needs.candidate.outputs.context }}
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact candidate and full-profile attempt
        run: python3 Scripts/ci_admission.py verify --context "$ADMISSION_CONTEXT" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"

      - name: Download the single root build
        uses: actions/download-artifact@v4
        with:
          name: root-build-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Restore build bundle and SwiftPM state
        shell: bash
        run: gzip -dc root-build.tar.gz | tar -xf -

      - name: Verify transferred build candidate and producer
        run: python3 Scripts/modularization_ci_artifact.py verify --admission-context "$ADMISSION_CONTEXT"

      - name: Run root test shard without compiling
        run: ./conductor ci-shard --shard-count 4 --shard-index ${{ matrix.shard }} --full-log

      - name: Retain execution receipts and full shard logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: shard-execution-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/ci-test-results/shard-*
          if-no-files-found: error
          retention-days: 7

  style:
    # Protect main requires exactly Style: it must be the FINAL gate, not an early green row.
    name: Style
    needs: [candidate, build-test-bundles, build-and-test, secret-scan, integration-products]
    if: always()
    env:
      ADMISSION_CONTEXT: ${{ needs.candidate.outputs.context }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Fail if a prerequisite failed or was skipped
        env:
          CANDIDATE_RESULT: ${{ needs.candidate.result }}
          PRODUCTS_RESULT: ${{ needs.integration-products.result }}
          BUILD_RESULT: ${{ needs.build-test-bundles.result }}
          SECRET_RESULT: ${{ needs.secret-scan.result }}
          SHARD_RESULT: ${{ needs.build-and-test.result }}
        shell: bash
        run: |
          {
            echo '## CI prerequisite results'
            echo "- Candidate declaration: $CANDIDATE_RESULT"
            echo "- Sentry/privacy and release-mode packaged smoke: $PRODUCTS_RESULT"
            echo "- Build and Static Gates: $BUILD_RESULT"
            echo "- Root test shards: $SHARD_RESULT"
            echo "- Secret Scan: $SECRET_RESULT"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ "$CANDIDATE_RESULT" != success || "$PRODUCTS_RESULT" != success || "$BUILD_RESULT" != success || "$SHARD_RESULT" != success || "$SECRET_RESULT" != success ]]; then
            echo '::error::CI prerequisite failed, was cancelled, or was skipped. Inspect the failing job; Style is the aggregate gate.'
            exit 1
          fi

      - name: Require one full-profile attempt
        run: python3 Scripts/ci_admission.py verify --context "$ADMISSION_CONTEXT" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"

      - name: Download expected coverage
        uses: actions/download-artifact@v4
        with:
          name: expected-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: expected-coverage

      - name: Download all shard execution receipts
        uses: actions/download-artifact@v4
        with:
          pattern: shard-execution-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: shard-execution
          merge-multiple: true

      - name: Prove exact union and every test target
        run: python3 Scripts/ci_test_coverage.py --metadata expected-coverage --receipts shard-execution --shard-count 4 --admission-context "$ADMISSION_CONTEXT"

  secret-scan:
    needs: candidate
    env:
      ADMISSION_CONTEXT: ${{ needs.candidate.outputs.context }}
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact candidate and full-profile attempt
        run: python3 Scripts/ci_admission.py verify --context "$ADMISSION_CONTEXT" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"

      - name: Install pinned gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan introduced commit range
        env:
          ADMISSION_RANGE: ${{ needs.candidate.outputs.range }}
        run: |
          set -euo pipefail
          gitleaks git --redact --log-opts="$ADMISSION_RANGE" .

      - name: Scan checked-in source tree
        run: gitleaks dir --redact .
