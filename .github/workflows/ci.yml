name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  style:
    name: Style
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run repository guardrails
        run: make guardrails

      - name: Test Xcode workspace generator
        run: make xcode-generator-test

      - name: Install Swift style tools
        run: ./Scripts/install_format_tools.sh install

      - name: Run Swift style lint
        run: make lint

      - name: Run conductor tests
        run: make conductor-selftest

      - name: Set up Node for pinned Codex CLI
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pinned Codex CLI
        run: npm install --global @openai/codex@0.145.0

      - name: Validate Codex app-server schema contract
        run: make dev-codex-schema-check

      - name: Run release workflow tests
        run: make release-selftest

  tip-stage:
    name: Tip Stage (secretless exact head)
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'repoprompt/repoprompt-ce'
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Check out exact main commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve Tip build metadata
        id: tip
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]] || {
            echo "Tip stage checkout does not match github.sha" >&2
            exit 1
          }
          stable_appcast="$RUNNER_TEMP/stable-appcast.xml"
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/repoprompt/repoprompt-ce-updates/releases/latest/download/appcast.xml \
            --output "$stable_appcast"
          python3 Scripts/resolve_tip_build.py \
            --repository "$GITHUB_WORKSPACE" \
            --commit "$EXPECTED_SHA" \
            --stable-appcast "$stable_appcast" \
            --github-output "$GITHUB_OUTPUT"

      - name: Stage exact Tip source without secrets
        env:
          TIP_COMMIT: ${{ steps.tip.outputs.commit }}
          TIP_SHORT_SHA: ${{ steps.tip.outputs.short-sha }}
          TIP_BUILD_NUMBER: ${{ steps.tip.outputs.build-number }}
          TIP_TAG: ${{ steps.tip.outputs.tag }}
          TIP_STABLE_BUILD_NUMBER: ${{ steps.tip.outputs.stable-build-number }}
          TIP_COMMIT_SEQUENCE: ${{ steps.tip.outputs.commit-sequence }}
          TIP_STAGE_REPOSITORY: repoprompt/repoprompt-ce
          TIP_STAGE_WORKFLOW: .github/workflows/ci.yml
          TIP_STAGE_EVENT: push
          TIP_STAGE_BRANCH: main
          TIP_STAGE_RUN_ID: ${{ github.run_id }}
          TIP_STAGE_RUN_ATTEMPT: ${{ github.run_attempt }}
          TIP_STAGE_ARTIFACT_NAME: RepoPrompt-CE-tip-stage-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          REPOPROMPT_REQUIRE_TIP_STAGE_METADATA: "1"
          REPOPROMPT_CONTROL_PLANE_SCRIPTS_DIR: ${{ github.workspace }}/Scripts
          REPOPROMPT_RELEASE_SOURCE_ROOT: ${{ github.workspace }}
          REPOPROMPT_ENABLE_SENTRY: "1"
        run: ./Scripts/main_tip_release.sh stage

      - name: Upload exact Tip stage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: RepoPrompt-CE-tip-stage-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            dist/*-stage.zip
            dist/*-stage.zip.sha256
            dist/*-stage-metadata.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  build-and-test:
    name: Build and Test (app shard ${{ matrix.shard }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Restore SwiftPM build cache
        uses: actions/cache@v6
        with:
          path: |
            .build
            Packages/RepoPromptAgentProviders/.build
          key: ${{ runner.os }}-${{ runner.arch }}-swiftpm-${{ hashFiles('Package.swift', 'Package.resolved', 'Packages/RepoPromptAgentProviders/Package.swift', 'Packages/RepoPromptAgentProviders/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swiftpm-

      - name: Build app product
        run: swift build --product RepoPrompt

      - name: Build MCP product
        run: swift build --product repoprompt-mcp

      - name: Run app tests
        shell: bash
        run: |
          set -euo pipefail
          # A single long-lived XCTest process accumulates suspended app-lifecycle tasks
          # and can wedge Swift's cooperative executor late in the suite on hosted runners.
          # Preserve serial test semantics while bounding each process to one small group.
          # The runner auto-discovers the built .xctest bundle and invokes xcrun xctest
          # directly, using ledger-backed runtime-balanced shards, slow-first ordering,
          # and conservative batching only for fast stateless suites.
          # Retry only silent startup timeouts; assertion failures fail fast in the runner.
          python3 Scripts/ci_app_test_runner.py \
            --suite-timeout-seconds 180 \
            --silent-timeout-retries 1 \
            --silent-startup-seconds 60 \
            --ledger Scripts/Fixtures/test-suite-contract-ledger.tsv \
            --strict-ledger \
            --shard-count 4 \
            --shard-index "${{ matrix.shard }}" \
            --slow-first \
            --batch-fast-suites \
            --require-runtime-for-batching


  sentry-enabled-build:
    name: Sentry-enabled Build
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Restore SwiftPM build cache
        uses: actions/cache@v6
        with:
          path: |
            .build
            Packages/RepoPromptAgentProviders/.build
          key: ${{ runner.os }}-${{ runner.arch }}-swiftpm-sentry-${{ hashFiles('Package.swift', 'Package.resolved', 'Packages/RepoPromptAgentProviders/Package.swift', 'Packages/RepoPromptAgentProviders/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swiftpm-

      - name: Build app product with Sentry SDK linked
        env:
          REPOPROMPT_ENABLE_SENTRY: "1"
        run: swift build --product RepoPrompt

      - name: Test serialized Sentry privacy boundary
        env:
          REPOPROMPT_ENABLE_SENTRY: "1"
        run: swift test --filter SentryTelemetryPrivacyTests

  provider-tests:
    name: Provider Tests
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Restore SwiftPM build cache
        uses: actions/cache@v6
        with:
          path: |
            .build
            Packages/RepoPromptAgentProviders/.build
          key: ${{ runner.os }}-${{ runner.arch }}-swiftpm-provider-${{ hashFiles('Package.swift', 'Package.resolved', 'Packages/RepoPromptAgentProviders/Package.swift', 'Packages/RepoPromptAgentProviders/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swiftpm-

      - name: Run provider package tests
        working-directory: Packages/RepoPromptAgentProviders
        run: swift test

  secret-scan:
    name: Secret Scan
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install gitleaks
        run: brew install gitleaks

      - name: Scan introduced commit range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            range="$PR_BASE_SHA..$PR_HEAD_SHA"
          elif [[ -n "$PUSH_BEFORE_SHA" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            range="$PUSH_BEFORE_SHA..$CURRENT_SHA"
          else
            range="$CURRENT_SHA"
          fi
          gitleaks git --redact --log-opts="$range" .

      - name: Scan checked-in source tree
        run: gitleaks dir --redact .
