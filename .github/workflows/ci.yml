name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
    branches: [main]
  push:
    branches:
      - main

concurrency:
  # Supersede obsolete PR previews only. Queue candidates, main evidence, and
  # explicit reruns retain their own run-scoped groups.
  group: ci-${{ github.event_name == 'pull_request' && github.run_attempt == '1' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == '1' }}

permissions:
  contents: read

jobs:
  candidate:
    name: Declare Integration Candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      failure: ${{ steps.diagnostics.outputs.failure }}
      context: ${{ steps.candidate.outputs.context }}
      range: ${{ steps.candidate.outputs.range }}
    steps:
      - uses: actions/checkout@v6
        id: actions-checkout-v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Normalize candidate, base, tree and profile
        id: candidate
        run: |
          python3 Scripts/ci_admission.py prepare --event-path "$GITHUB_EVENT_PATH" \
            --event-name "$GITHUB_EVENT_NAME" --sha "$GITHUB_SHA" --ref "$GITHUB_REF" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --output "$GITHUB_OUTPUT"
      - name: Broadcast failed steps and recovery
        id: diagnostics
        if: always()
        env:
          STEPS_CONTEXT: ${{ toJSON(steps) }}
        run: |
          if [[ -f Scripts/ci_job_diagnostics.py ]]; then
            python3 Scripts/ci_job_diagnostics.py job
          else
            echo '::error::Checkout unavailable; inspect checkout/runner failure. No CI evidence was accepted.'
            echo 'Checkout unavailable: inspect checkout/runner failure; no evidence accepted.' >> "$GITHUB_STEP_SUMMARY"
          fi

  workflow-contracts:
    name: Workflow Contracts
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      failure: ${{ steps.diagnostics.outputs.failure }}
    steps:
      - name: Check out repository
        id: check-out-repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Test workflow and admission contracts before allocating macOS
        id: test-workflow-contracts
        run: make ci-workflow-selftest
      - name: Broadcast failed steps and recovery
        id: diagnostics
        if: always()
        env:
          STEPS_CONTEXT: ${{ toJSON(steps) }}
        run: |
          if [[ -f Scripts/ci_job_diagnostics.py ]]; then
            python3 Scripts/ci_job_diagnostics.py job
          else
            echo '::error::Workflow-contract checkout unavailable; inspect the job log.'
            echo 'Workflow-contract checkout unavailable; inspect the job log.' >> "$GITHUB_STEP_SUMMARY"
          fi

  integration-products:
    # Sentry/privacy stays blocking, after root gates reject bad candidates.
    # Universal packaging/older-runtime smoke gate publication in release flows;
    # do not duplicate those expensive builds on every integration candidate.
    needs: [candidate, build-test-bundles, build-and-test, secret-scan]
    uses: ./.github/workflows/ci-integration-products.yml
    with:
      admission: ${{ needs.candidate.outputs.context }}

  build-test-bundles:
    needs: [candidate, workflow-contracts]
    env:
      ADMISSION_CONTEXT: ${{ needs.candidate.outputs.context }}
    name: Build and Static Gates
    # Standard/free Intel pool; ARM64 allocation failures must not strand integration.
    runs-on: macos-26-intel
    timeout-minutes: 75
    outputs:
      failure: ${{ steps.diagnostics.outputs.failure }}
      context: ${{ steps.producer.outputs.context }}
    steps:
      - name: Check out repository
        id: check-out-repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify immutable candidate
        id: verify-immutable-candidate
        run: python3 Scripts/ci_admission.py verify --context "$ADMISSION_CONTEXT" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"

      - name: Declare this root build producer and toolchain
        id: producer
        run: python3 Scripts/ci_admission.py produce --context "$ADMISSION_CONTEXT" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --output "$GITHUB_OUTPUT"

      - name: Identify SwiftPM support cache compatibility
        id: support-toolchain
        shell: bash
        run: |
          set -euo pipefail
          key="$(python3 Scripts/ci_release_cache.py --sentry 0)"
          [[ "$key" =~ ^swiftpm-release-v2-[0-9a-f]{64}$ ]]
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Restore SwiftPM dependencies and provider support cache
        id: rootbundles-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .build/checkouts
            .build/repositories
            .build/workspace-state.json
            Packages/RepoPromptAgentProviders/.build
          # The enforcing root build cleans its products anyway. Do not transfer
          # them (or admission receipts), or save another multi-GB copy per commit.
          key: support-${{ steps.support-toolchain.outputs.key }}

      - name: Invalidate cached admission evidence before any build or selftest
        id: invalidate-cached-admission-evidence-before-any-build-or-selftest
        if: always()
        run: python3 Scripts/ci_admission.py invalidate --context "$ADMISSION_CONTEXT" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"

      - name: Restore checksum-verified SwiftPM binary artifacts
        id: binaries-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .build/artifacts
            .build/swiftbuild/artifacts
            Packages/RepoPromptAgentProviders/.build/artifacts
            ~/Library/Caches/org.swift.swiftpm/artifacts
          key: ${{ runner.os }}-${{ runner.arch }}-swiftpm-binaries-v1-${{ hashFiles('Package.resolved', 'Packages/RepoPromptAgentProviders/Package.resolved') }}

      - name: Resolve dependency downloads with bounded retries
        id: resolve-dependency-downloads-with-bounded-retries
        run: |
          python3 Scripts/ci_resolve_packages.py
          python3 Scripts/ci_resolve_packages.py --scratch-path .build/swiftbuild
          python3 Scripts/ci_resolve_packages.py --root Packages/RepoPromptAgentProviders

      - name: Run repository guardrails
        id: run-repository-guardrails
        run: make guardrails

      - name: Run hosted runner and admission selftests
        id: run-hosted-runner-and-admission-selftests
        run: make ci-app-test-runner-selftest

      - name: Install Swift style tools
        id: install-swift-style-tools
        run: ./Scripts/install_format_tools.sh install

      - name: Run Swift style lint
        id: run-swift-style-lint
        run: make lint

      - name: Run conductor tests
        id: run-conductor-tests
        run: make conductor-selftest

      - name: Set up Node for pinned Codex CLI
        id: set-up-node-for-pinned-codex-cli
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pinned Codex CLI
        id: install-pinned-codex-cli
        run: npm install --global @openai/codex@0.164.0

      - name: Validate Codex app-server schema contract
        id: validate-codex-app-server-schema-contract
        run: make dev-codex-schema-check

      - name: Run release workflow tests
        id: run-release-workflow-tests
        run: make release-selftest

      - name: Run provider package tests
        id: run-provider-package-tests
        run: ./conductor provider-test

      - name: Build root test bundles with import and type-check gates
        id: build-root-test-bundles-with-import-and-type-check-gates
        shell: bash
        env:
          # One measurement protocol and unchanged budget on PR, queue and main.
          TYPECHECK_RATCHET_ENFORCE: "1"
        run: |
          set -uo pipefail
          set +e
          ./conductor ci-build-tests 2>&1 | tee "$RUNNER_TEMP/ci-build-tests-conductor.txt"
          build_status=${PIPESTATUS[0]}
          set -e
          if (( build_status != 0 )); then
            log_path="$(sed -n 's/^Log:[[:space:]]*//p' "$RUNNER_TEMP/ci-build-tests-conductor.txt" | tail -n 1)"
            if [[ -n "$log_path" && -f "$log_path" ]]; then
              cp "$log_path" "$RUNNER_TEMP/ci-build-tests.log"
              echo 'Compiler errors and test failures from the full conductor log:'
              grep -E 'error:|FAIL' "$RUNNER_TEMP/ci-build-tests.log" || true
            else
              echo "Conductor full log was unavailable: $log_path" >&2
            fi
          fi
          exit "$build_status"

      - name: Retain type-check measurements on success and failure
        id: retain-type-check-measurements-on-success-and-failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-timing-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/modularization/typecheck-timing.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failed root test build log
        id: upload-failed-root-test-build-log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: root-build-tests-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ci-build-tests.log
            ${{ runner.temp }}/ci-build-tests-conductor.txt
          if-no-files-found: warn

      - name: Gate compiler index ratchets on the built sources
        id: compiler_index_gate
        run: python3 Scripts/modularization_index_graph.py check --output .build/modularization/index-check.json

      - name: Capture failed compiler index graph
        id: capture-failed-compiler-index-graph
        if: ${{ failure() && steps.compiler_index_gate.outcome == 'failure' }}
        run: |
          mkdir -p .build/modularization
          python3 Scripts/modularization_index_graph.py dump --output .build/modularization/index-failure-graph.json

      - name: Retain failed compiler index diagnostics
        id: retain-failed-compiler-index-diagnostics
        if: ${{ failure() && steps.compiler_index_gate.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: compiler-index-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .build/modularization/index-failure-graph.json
            .build/modularization/app-source-sha256.json
          if-no-files-found: error
          retention-days: 3

      # All executor-parity module checks gate PRs before merge, on the same warm VM.
      - name: Run all app-free module parity tests
        id: run-all-app-free-module-parity-tests
        shell: bash
        run: |
          set -euo pipefail
          modules="$(python3 Scripts/modularization_affected_tests.py --all | python3 -c 'import json,sys; print(" ".join(row["module"] for row in json.load(sys.stdin)["include"]))')"
          test -n "$modules"
          for module in $modules; do
            ./conductor test --module "$module" --full-log
          done

      - name: Retain full module execution logs
        id: retain-full-module-execution-logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: module-execution-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/ci-test-results/module-*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Bind root producer to the immutable candidate
        id: bind-root-producer-to-the-immutable-candidate
        env:
          ROOT_CONTEXT: ${{ steps.producer.outputs.context }}
        run: python3 Scripts/ci_admission.py bind --context "$ADMISSION_CONTEXT" --producer-context "$ROOT_CONTEXT" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --check-toolchain

      - name: Archive only runnable test products and gate attestations
        id: archive-only-runnable-test-products-and-gate-attestations
        env:
          ROOT_CONTEXT: ${{ steps.producer.outputs.context }}
        run: python3 Scripts/modularization_ci_artifact.py pack --output root-build.tar.gz --admission-context "$ROOT_CONTEXT"

      - name: Share expected coverage independently of the runnable products
        id: share-expected-coverage-independently-of-the-runnable-products
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.producer.outputs.coverage_artifact }}
          path: |
            .build/modularization/ci-test-list.txt
            .build/modularization/test-targets.json
            .build/modularization/admission.json
          if-no-files-found: error
          retention-days: 7

      - name: Share the single build with test shards
        id: share-the-single-build-with-test-shards
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: ${{ steps.producer.outputs.build_artifact }}
          path: root-build.tar.gz
          retention-days: 7

      # Keep binary artifacts main-scoped too; PRs restore without saving their own caches.
      - name: Save checksum-verified SwiftPM binary artifacts (main only)
        id: save-checksum-verified-swiftpm-binary-artifacts-main-only
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.binaries-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            .build/artifacts
            .build/swiftbuild/artifacts
            Packages/RepoPromptAgentProviders/.build/artifacts
            ~/Library/Caches/org.swift.swiftpm/artifacts
          key: ${{ steps.binaries-cache.outputs.cache-primary-key }}

      # One compatible main seed; PRs restore only. Root products/receipts are
      # transferred explicitly to shards, never through an acceleration cache.
      - name: Save SwiftPM dependencies and provider support cache (main only)
        id: save-swiftpm-dependencies-and-provider-support-cache-main-only
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.rootbundles-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            .build/checkouts
            .build/repositories
            .build/workspace-state.json
            Packages/RepoPromptAgentProviders/.build
          key: ${{ steps.rootbundles-cache.outputs.cache-primary-key }}

      - name: Broadcast failed steps and recovery
        id: diagnostics
        if: always()
        env:
          STEPS_CONTEXT: ${{ toJSON(steps) }}
        run: |
          if [[ -f Scripts/ci_job_diagnostics.py ]]; then
            python3 Scripts/ci_job_diagnostics.py job
          else
            echo '::error::Checkout unavailable; inspect checkout/runner failure. No CI evidence was accepted.'
            echo 'Checkout unavailable: inspect checkout/runner failure; no evidence accepted.' >> "$GITHUB_STEP_SUMMARY"
          fi

  build-and-test:
    name: Test Root Shards (No Build)
    needs: [candidate, build-test-bundles]
    env:
      ADMISSION_CONTEXT: ${{ needs.build-test-bundles.outputs.context }}
      CANDIDATE_CONTEXT: ${{ needs.candidate.outputs.context }}
    # Standard/free Intel pool; ARM64 allocation failures must not strand integration.
    runs-on: macos-26-intel
    # One allocation/transfer, four logical shards. Each keeps its own deadline.
    # 4 * 32 minutes plus setup/receipt upload; not a larger per-suite budget.
    timeout-minutes: 140
    outputs:
      failure: ${{ steps.diagnostics.outputs.failure }}
      receipt_artifact: ${{ steps.execution.outputs.artifact }}
    steps:
      - name: Check out repository
        id: check-out-repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Select the successful root producer and verify toolchain
        id: selected
        run: python3 Scripts/ci_admission.py select --context "$CANDIDATE_CONTEXT" --producer-context "$ADMISSION_CONTEXT" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --check-toolchain --output "$GITHUB_OUTPUT"

      - name: Download the single root build
        id: download-the-single-root-build
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.selected.outputs.build_artifact }}

      - name: Restore build bundle and SwiftPM state
        id: restore-build-bundle-and-swiftpm-state
        shell: bash
        run: gzip -dc root-build.tar.gz | tar -xf -

      - name: Verify transferred build candidate and producer
        id: verified-build
        run: python3 Scripts/modularization_ci_artifact.py verify --admission-context "$ADMISSION_CONTEXT"

      - name: Declare this execution artifact
        id: execution
        run: echo "artifact=shard-execution-all-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      # A failed shard must not suppress the remaining coverage. A failed setup
      # or cancellation must not start tests. Never mask failures; Style must fail.
      - name: Run root test shard 1 without compiling
        id: run-root-test-shard-1-without-compiling
        if: ${{ !cancelled() && steps.verified-build.outcome == 'success' }}
        timeout-minutes: 32
        run: ./conductor ci-shard --shard-count 4 --shard-index 1 --timeout 1800 --full-log

      - name: Run root test shard 2 without compiling
        id: run-root-test-shard-2-without-compiling
        if: ${{ !cancelled() && steps.verified-build.outcome == 'success' }}
        timeout-minutes: 32
        run: ./conductor ci-shard --shard-count 4 --shard-index 2 --timeout 1800 --full-log

      - name: Run root test shard 3 without compiling
        id: run-root-test-shard-3-without-compiling
        if: ${{ !cancelled() && steps.verified-build.outcome == 'success' }}
        timeout-minutes: 32
        run: ./conductor ci-shard --shard-count 4 --shard-index 3 --timeout 1800 --full-log

      - name: Run root test shard 4 without compiling
        id: run-root-test-shard-4-without-compiling
        if: ${{ !cancelled() && steps.verified-build.outcome == 'success' }}
        timeout-minutes: 32
        run: ./conductor ci-shard --shard-count 4 --shard-index 4 --timeout 1800 --full-log

      - name: Retain execution receipts and full shard logs
        id: retain-execution-receipts-and-full-shard-logs
        if: ${{ always() && steps.execution.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.execution.outputs.artifact }}
          path: .build/ci-test-results/shard-*
          if-no-files-found: error
          retention-days: 7

      - name: Broadcast failed steps and recovery
        id: diagnostics
        if: always()
        env:
          STEPS_CONTEXT: ${{ toJSON(steps) }}
        run: |
          if [[ -f Scripts/ci_job_diagnostics.py ]]; then
            python3 Scripts/ci_job_diagnostics.py job
          else
            echo '::error::Checkout unavailable; inspect checkout/runner failure. No CI evidence was accepted.'
            echo 'Checkout unavailable: inspect checkout/runner failure; no evidence accepted.' >> "$GITHUB_STEP_SUMMARY"
          fi

  style:
    # Protect main requires exactly Style: it must be the FINAL gate, not an early green row.
    name: Style
    needs: [candidate, workflow-contracts, build-test-bundles, build-and-test, secret-scan, integration-products]
    if: always()
    env:
      ADMISSION_CONTEXT: ${{ needs.build-test-bundles.outputs.context }}
      CANDIDATE_CONTEXT: ${{ needs.candidate.outputs.context }}
      RECEIPT_ARTIFACT: ${{ needs.build-and-test.outputs.receipt_artifact }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      failure: ${{ steps.diagnostics.outputs.failure }}
    steps:
      - name: Check out repository
        id: check-out-repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Report prerequisites and release eligibility
        id: report-prerequisites-and-release-eligibility
        if: always()
        env:
          NEEDS_CONTEXT: ${{ toJSON(needs) }}
        run: |
          if [[ -f Scripts/ci_job_diagnostics.py ]]; then
            python3 Scripts/ci_job_diagnostics.py prerequisites
          else
            echo '::error::Prerequisite report unavailable after checkout failure. Inspect the dependency jobs; evidence cannot be accepted.'
            echo 'Prerequisite report unavailable after checkout failure; inspect dependency jobs.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Select exact successful producer evidence
        id: selected
        run: python3 Scripts/ci_admission.py select --context "$CANDIDATE_CONTEXT" --producer-context "$ADMISSION_CONTEXT" --receipt-artifact "$RECEIPT_ARTIFACT" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --output "$GITHUB_OUTPUT"

      - name: Download expected coverage
        id: download-expected-coverage
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.selected.outputs.coverage_artifact }}
          path: expected-coverage

      - name: Download all shard execution receipts
        id: download-all-shard-execution-receipts
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.selected.outputs.receipt_artifact }}
          path: shard-execution

      - name: Prove exact union and every test target
        id: prove-exact-union-and-every-test-target
        run: python3 Scripts/ci_test_coverage.py --metadata expected-coverage --receipts shard-execution --shard-count 4 --admission-context "$ADMISSION_CONTEXT"

      - name: Broadcast failed steps and recovery
        id: diagnostics
        if: always()
        env:
          STEPS_CONTEXT: ${{ toJSON(steps) }}
        run: |
          if [[ -f Scripts/ci_job_diagnostics.py ]]; then
            python3 Scripts/ci_job_diagnostics.py job
          else
            echo '::error::Checkout unavailable; inspect checkout/runner failure. No CI evidence was accepted.'
            echo 'Checkout unavailable: inspect checkout/runner failure; no evidence accepted.' >> "$GITHUB_STEP_SUMMARY"
          fi

  secret-scan:
    # Contract failures must not suppress the introduced-range scan on main.
    needs: candidate
    env:
      ADMISSION_CONTEXT: ${{ needs.candidate.outputs.context }}
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      failure: ${{ steps.diagnostics.outputs.failure }}
    steps:
      - name: Check out repository
        id: check-out-repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify immutable candidate
        id: verify-immutable-candidate
        run: python3 Scripts/ci_admission.py verify --context "$ADMISSION_CONTEXT" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"

      - name: Install pinned gitleaks
        id: install-pinned-gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan introduced commit range
        id: scan-introduced-commit-range
        env:
          ADMISSION_RANGE: ${{ needs.candidate.outputs.range }}
        run: |
          set -euo pipefail
          gitleaks git --redact --log-opts="$ADMISSION_RANGE" .

      - name: Scan checked-in source tree
        id: scan-checked-in-source-tree
        run: gitleaks dir --redact .

      - name: Broadcast failed steps and recovery
        id: diagnostics
        if: always()
        env:
          STEPS_CONTEXT: ${{ toJSON(steps) }}
        run: |
          if [[ -f Scripts/ci_job_diagnostics.py ]]; then
            python3 Scripts/ci_job_diagnostics.py job
          else
            echo '::error::Checkout unavailable; inspect checkout/runner failure. No CI evidence was accepted.'
            echo 'Checkout unavailable: inspect checkout/runner failure; no evidence accepted.' >> "$GITHUB_STEP_SUMMARY"
          fi
