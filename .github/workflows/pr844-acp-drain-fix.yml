name: Remove temporary PR 844 staging branch

on:
  push:
    branches:
      - agent/pr844-acp-drain-fix-staging

permissions:
  contents: write

concurrency:
  group: pr844-acp-drain-fix-staging
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete staging branch
        shell: bash
        run: git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" --delete "${GITHUB_REF_NAME}"
