name: PR 844 ACP drain fix staging

on:
  push:
    branches:
      - agent/pr844-acp-drain-fix-staging

permissions:
  contents: write

concurrency:
  group: pr844-acp-drain-fix-staging
  cancel-in-progress: true

jobs:
  patch-test-and-push:
    runs-on: macos-26
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply scoped review fix
        shell: bash
        env:
          ORIGINAL_HEAD: 42caf099cee9a390dfa890bbf8ece0c439159755
          TARGET_BRANCH: agent/grok-oracle-full-response
          STAGING_BRANCH: agent/pr844-acp-drain-fix-staging
        run: |
          set -euo pipefail
          cat > /tmp/pr844.patch <<'PATCH'
          diff --git a/Sources/RepoPrompt/Infrastructure/AI/ACP/ACPAgentSessionController.swift b/Sources/RepoPrompt/Infrastructure/AI/ACP/ACPAgentSessionController.swift
          --- a/Sources/RepoPrompt/Infrastructure/AI/ACP/ACPAgentSessionController.swift
          +++ b/Sources/RepoPrompt/Infrastructure/AI/ACP/ACPAgentSessionController.swift
          @@ -1180,9 +1180,9 @@ actor ACPAgentSessionController {
               /// Shuts down a completed one-shot prompt without discarding bytes that become
               /// readable while the ACP process responds to stdin closure.
               ///
          -    /// Returns `true` only when the process settles cooperatively before the bounded
          -    /// timeout. A forced termination still drains its pipes, but cannot prove that the
          -    /// provider finished writing the response.
          +    /// Returns `true` only when the process and both transport pipes settle cooperatively
          +    /// before the bounded timeout. Forced cleanup preserves already-read bytes, but cannot
          +    /// prove that the provider finished writing the response.
               func shutdownAfterPromptTransportDrain() async -> Bool {
                   await shutdown(drainTransport: true)
               }
          @@ -1200,11 +1200,9 @@ actor ACPAgentSessionController {
               var transportSettled = !drainTransport
               if drainTransport, let process {
                   process.stdin?.closeFile()
          -        transportSettled = await waitForProcessExitDuringTransportDrain()
          +        transportSettled = await waitForTransportSettlementDuringDrain(for: process)
                   process.stdout.readabilityHandler = nil
                   process.stderr.readabilityHandler = nil
          -        drainRemainingBytes(from: process.stdout, into: stdoutChannel)
          -        drainRemainingBytes(from: process.stderr, into: stderrChannel)
                   stdoutChannel?.finish()
                   stderrChannel?.finish()
                   await stdoutConsumerTask?.value
          @@ -1264,37 +1262,49 @@ actor ACPAgentSessionController {
                   return transportSettled
               }
           
          -    private func waitForProcessExitDuringTransportDrain() async -> Bool {
          -        guard let processWaitTask else { return true }
          +    private func waitForTransportSettlementDuringDrain(for process: SpawnedProcess) async -> Bool {
          +        guard let processWaitTask,
          +              let stdoutConsumerTask,
          +              let stderrConsumerTask
          +        else {
          +            processWaitTask?.cancel()
          +            await processWaitTask?.value
          +            await ProcessTermination.terminateProcessGroupAfterRootReap(
          +                processGroupID: process.processGroupID
          +            )
          +            return false
          +        }
          +
                   let timeout = ProcessTermination.cooperativeCancellationWaitTimeout()
                   return await withTaskGroup(of: Bool.self) { group in
                       group.addTask {
                           await processWaitTask.value
          +                await stdoutConsumerTask.value
          +                await stderrConsumerTask.value
                           return true
                       }
                       group.addTask {
                           do {
                               try await Task.sleep(nanoseconds: UInt64(timeout * 1_000_000_000))
                           } catch {
          -                    processWaitTask.cancel()
                               return false
                           }
          -                processWaitTask.cancel()
                           return false
                       }
          +
                       let settled = await group.next() ?? false
          +            if !settled {
          +                processWaitTask.cancel()
          +                await processWaitTask.value
          +                await ProcessTermination.terminateProcessGroupAfterRootReap(
          +                    processGroupID: process.processGroupID
          +                )
          +            }
                       group.cancelAll()
                       return settled
                   }
               }
          -
          -    private func drainRemainingBytes(from handle: FileHandle, into channel: FileHandleChunkChannel?) {
          -        while true {
          -            let data = handle.availableData
          -            guard !data.isEmpty else { return }
          -            channel?.yield(data)
          -        }
          -    }
           
               // MARK: - Transport
          diff --git a/Tests/RepoPromptTests/AgentMode/GrokBuildACPHeadlessAgentProviderTests.swift b/Tests/RepoPromptTests/AgentMode/GrokBuildACPHeadlessAgentProviderTests.swift
          --- a/Tests/RepoPromptTests/AgentMode/GrokBuildACPHeadlessAgentProviderTests.swift
          +++ b/Tests/RepoPromptTests/AgentMode/GrokBuildACPHeadlessAgentProviderTests.swift
          @@ -100,6 +100,20 @@ final class GrokBuildACPHeadlessAgentProviderTests: XCTestCase {
                   XCTAssertEqual(results.last?.stopReason, "transport_did_not_settle_before_shutdown")
               }
           
          +    func testRootExitWithLingeringPipeWriterMarksTransportIncomplete() async throws {
          +        let harness = try makeHarness()
          +        let provider = harness.makeHeadlessProvider(modelString: nil, scenario: .lingeringPipeWriter)
          +        let startedAt = Date()
          +
          +        let results = try await collect(provider, message: "hi")
          +
          +        XCTAssertLessThan(Date().timeIntervalSince(startedAt), 15)
          +        XCTAssertEqual(results.filter { $0.type == "content" }.compactMap(\.text), ["No."])
          +        XCTAssertEqual(results.last?.type, AIStreamResult.incompleteType)
          +        XCTAssertEqual(results.last?.stopReason, "transport_did_not_settle_before_shutdown")
          +    }
          +
               // MARK: - Harness
           
               private enum Scenario: String {
          @@ -109,6 +123,7 @@ final class GrokBuildACPHeadlessAgentProviderTests: XCTestCase {
                   case preTerminalFragments = "pre_terminal_fragments"
                   case postResponseContent = "post_response_content"
                   case unsettledTransport = "unsettled_transport"
          +        case lingeringPipeWriter = "lingering_pipe_writer"
               }
           
               private struct Harness {
          @@ -198,6 +213,7 @@ final class GrokBuildACPHeadlessAgentProviderTests: XCTestCase {
                   import json
                   import os
          +        import subprocess
                   import sys
                   import time
           
          @@ -286,6 +302,14 @@ final class GrokBuildACPHeadlessAgentProviderTests: XCTestCase {
                           respond(request_id, {"stopReason": "end_turn"})
                           while True:
                               time.sleep(1)
          +            elif scenario == "lingering_pipe_writer":
          +                emit_content("No.")
          +                respond(request_id, {"stopReason": "end_turn"})
          +                subprocess.Popen(
          +                    [sys.executable, "-c", "import time; time.sleep(30)"],
          +                    stdin=subprocess.DEVNULL
          +                )
          +                sys.exit(0)
                       else:
                           emit_content("pong")
                           respond(request_id, {"stopReason": "end_turn"})
          PATCH

          git apply --check --recount /tmp/pr844.patch
          git apply --recount /tmp/pr844.patch
          git diff --check

          swift test --filter GrokBuildACPHeadlessAgentProviderTests
          swift test --filter ProviderStreamCompletionTests

          rm .github/workflows/pr844-acp-drain-fix.yml
          git add -A
          git diff --cached --check

          expected=$'Sources/RepoPrompt/Infrastructure/AI/ACP/ACPAgentSessionController.swift\nTests/RepoPromptTests/AgentMode/GrokBuildACPHeadlessAgentProviderTests.swift'
          actual="$(git diff --cached --name-only "$ORIGINAL_HEAD")"
          if [[ "$actual" != "$expected" ]]; then
            printf 'Unexpected staged paths:\n%s\n' "$actual" >&2
            exit 1
          fi

          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          if [[ "$remote_head" != "$ORIGINAL_HEAD" ]]; then
            echo "Target branch moved from $ORIGINAL_HEAD to $remote_head" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tree="$(git write-tree)"
          clean_commit="$(printf '%s\n' 'Harden ACP transport drain settlement' | git commit-tree "$tree" -p "$ORIGINAL_HEAD")"

          git show --stat --oneline "$clean_commit"
          git diff --check "$ORIGINAL_HEAD" "$clean_commit"
          git push origin "$clean_commit:refs/heads/$TARGET_BRANCH"
          git push origin --delete "$STAGING_BRANCH"
          echo "Created clean PR commit $clean_commit"
